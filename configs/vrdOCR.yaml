MODEL:
  architecture: vrdOCR
  backbone:
    name: HRNET32
    freeze_backbone: false
    pretrained: false

  head:
    name: MultiHead
    in_channels: 480

    out_channels_list:
      CTCLabelDecode: 97
      NRTRLabelDecode: 100

    head_list:
      - name: CTCHead
        decoder_key: CTCLabelDecode
        fc_decay: 1.0e-5
        neck:
          name: svtr
          dims: 120
          depth: 2
          hidden_dims: 120
          kernel_size: [1, 3]
          use_guide: true
          

      - name: NRTRHead
        decoder_key: NRTRLabelDecode
        nrtr_dim: 384
        max_text_length: 150
  loss:
    name: MultiLoss
    loss_config_list:
      - name: CTCLoss
      - name: NRTRLoss

DECODER:
  - name: CTCLabelDecode
    character_dict_path: ./data/en_dict.txt
    use_space_char: true

TRAIN:
  epochs: 1000
  lr: 0.0001
  save_interval: 5
  print_interval: 10
  eval_interval: 10
  resume_checkpoint: null
  device: cuda:0

DATASET:
  dir: /home/multi-gpu/Talal/vrdOCR/data/toyota_dataset
  train: labels_train.txt
  val: labels_val.txt
  test: labels_test.txt
  max_text_length: 150
  character_dict_path: ./data/en_dict.txt

batch_size: 16
num_workers: 8