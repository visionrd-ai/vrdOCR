MODEL:
  architecture: vrdOCR
  backbone:
    name: HRNET32
    freeze_backbone: false
    pretrained: false

  head:
    name: MultiHead
    in_channels: 480

    out_channels_list:
      CTCLabelDecode: 97
      NRTRLabelDecode: 100

    head_list:
      - name: CTCHead
        decoder_key: CTCLabelDecode
        fc_decay: 1.0e-5
        neck:
          name: svtr
          dims: 120
          depth: 2
          hidden_dims: 120
          kernel_size: [1, 3]
          use_guide: true
          

      - name: NRTRHead
        decoder_key: NRTRLabelDecode
        nrtr_dim: 384
        max_text_length: 150
  loss:
    name: MultiLoss
    loss_config_list:
      - name: CTCLoss
      - name: NRTLoss

DECODER:
  - type: CTCLabelDecode
    character_dict_path: ./ppocr/utils/ppocr_keys_v1.txt
    use_space_char: false
    batch_max_length: 25
    use_cha_eos: false

TRAIN:
  dataset_train: /home/multi-gpu/Talal/datasets/Toyota_ocr/train
  dataset_val: /home/multi-gpu/Talal/datasets/Toyota_ocr/val
  batch_size: 16
  epochs: 100
  lr: 0.0001
  lr_scheduler:
    name: Cosine
    epochs: 100
    eta_min: 1.0e-6
    last_epoch: -1
  save_interval: 1
  print_interval: 10
  eval_interval: 1
  resume_checkpoint: null
  pretrained_weights: null
  device: cuda:0

DATASET:
  train: /home/multi-gpu/Talal/datasets/Toyota_ocr/train
  val: /home/multi-gpu/Talal/datasets/Toyota_ocr/val
  test: /home/multi-gpu/Talal/datasets/Toyota_ocr/test
