MODEL:
  architecture: vrdOCR
  backbone:
    name: HRNET18
    freeze_backbone: false
    pretrained: false

  head:
    name: MultiHead
    in_channels: 480

    out_channels_list:
      CTCLabelDecode: 97

    head_list:
      - name: CTCHeadV2
        decoder_key: CTCLabelDecode
        fc_decay: 1.0e-5
        neck:
          name: SequenceEncoderNeckV2
          dims: 120
          depth: 2
          hidden_dims: 120
          kernel_size: [1, 3]
          use_guide: true
  loss:
    name: MultiLoss
    loss_config_list:
      - name: CTCLossV2


DECODER:
  - name: CTCLabelDecode
    character_dict_path: ./data/en_dict.txt
    use_space_char: true


TRAIN:
  epochs: 1000
  lr: 0.0001
  save_interval: 50
  print_interval: 2
  eval_interval: 2
  resume_checkpoint: null
  device: cuda:0

DATASET:
  dir: /home/multi-gpu/Talal/vrdOCR/data/toyota_dataset
  train: labels_train.txt
  val: labels_val.txt
  test: labels_test.txt
  max_text_length: 150
  character_dict_path: ./data/en_dict.txt

batch_size: 16
num_workers: 8