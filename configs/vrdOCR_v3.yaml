MODEL:
  architecture: vrdOCRV2
  backbone:
    name: HRNET32
    freeze_backbone: false
    pretrained: true

  in_channels: 480

  out_channels_list:
      CTCLabelDecode: 97

  neck:
    name: SVTRNeckV2
    d_model: 256
    num_layers: 2
    nhead: 4
    dim_feedforward: 512
    dropout: 0.1
    pool: avg

  head:
    name: CTCHeadAuto


LOSS:
  name: CTCLossV3


DECODER:
  - name: CTCGreedy
    character_dict_path: ./data/en_dict.txt
    use_space_char: true
    blank_idx: 0


TRAIN:
  epochs: 1000
  epochs: 1000
  lr: 0.0001
  save_interval: 50
  print_interval: 2
  eval_interval: 2
  resume_checkpoint: null
  device: cuda:0

DATASET:
  dir: /home/multi-gpu/Talal/vrdOCR/data/toyota_dataset
  train: labels_train.txt
  val: labels_val.txt
  test: labels_test.txt
  max_text_length: 150
  character_dict_path: ./data/en_dict.txt

batch_size: 16
num_workers: 8